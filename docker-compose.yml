services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: suede
      POSTGRES_PASSWORD: suede
      POSTGRES_DB: suede_pricing
    ports: ["5433:5432"]          # 5433 on the host so it doesn't clash with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suede -d suede_pricing"]
      interval: 2s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://suede:suede@db:5432/suede_pricing
      INPUTS_FILE: /app/inputs.json
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    command: ["sh", "-c", "Xvfb :99 -screen 0 1366x900x24 -nolisten tcp & exec uvicorn api:app --host 0.0.0.0 --port 8000 --reload"]
    shm_size: 1gb                          # headed Chromium crashes on the default 64 MB /dev/shm
    volumes:
      - ./backend:/app                     # live code (dev); evidence/ lands in ./backend/evidence on the host
      - ./inputs.json:/app/inputs.json:ro
    depends_on:
      db: {condition: service_healthy}

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app                    # live code: Vite hot-reloads, no rebuild for UI edits
      - /app/node_modules                  # keep the image's installed node_modules (not the host's)
    depends_on: [backend]

volumes:
  pgdata:
